<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grey Parrot – Test Softphone</title>
    <script src="https://sdk.twilio.com/js/client/releases/1.14.0/twilio.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .phone {
            background: white;
            border-radius: 16px;
            padding: 32px;
            width: 320px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
            text-align: center;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 20px;
            color: #1a1a2e;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 13px;
            color: #888;
            margin-bottom: 24px;
        }

        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
            background: #ccc;
        }

        .status-dot.ready   { background: #28a745; }
        .status-dot.ringing { background: #ffc107; animation: pulse 0.8s infinite; }
        .status-dot.oncall  { background: #4a90e2; }
        .status-dot.error   { background: #dc3545; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.3; }
        }

        #status-text {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 24px;
        }

        .actions {
            display: flex;
            gap: 12px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:disabled { opacity: 0.35; cursor: not-allowed; }

        #answer-btn {
            background: #28a745;
            color: white;
        }

        #hangup-btn {
            background: #dc3545;
            color: white;
        }

        .hint {
            margin-top: 20px;
            font-size: 12px;
            color: #aaa;
            line-height: 1.6;
        }
    </style>
</head>
<body>
<div class="phone">
    <div class="logo">🦜</div>
    <h1>Grey Parrot</h1>
    <p class="subtitle">Test Softphone</p>

    <div id="status-text">
        <span class="status-dot" id="dot"></span>
        <span id="status-label">Click Connect to start</span>
    </div>

    <div class="actions" id="connect-row">
        <button id="connect-btn">Connect</button>
    </div>

    <div class="actions" id="call-row" style="display:none">
        <button id="answer-btn" disabled>Answer</button>
        <button id="hangup-btn" disabled>Hang Up</button>
    </div>

    <p class="hint">
        Click Connect, then call your Twilio number from your phone.<br>
        This browser will ring — click Answer to pick up.<br>
        The Grey Parrot extension will translate the call.
    </p>
</div>

<script>
    const dot         = document.getElementById('dot');
    const statusLabel = document.getElementById('status-label');
    const connectBtn  = document.getElementById('connect-btn');
    const connectRow  = document.getElementById('connect-row');
    const callRow     = document.getElementById('call-row');
    const answerBtn   = document.getElementById('answer-btn');
    const hangupBtn   = document.getElementById('hangup-btn');

    let device, activeConnection;

    function setStatus(state, text) {
        dot.className = `status-dot ${state}`;
        statusLabel.textContent = text;
    }

    // init() must only be called from a user gesture so Chrome allows AudioContext
    async function init() {
        connectBtn.disabled = true;
        setStatus('', 'Connecting...');
        try {
            const res  = await fetch('/token');
            const data = await res.json();
            device = new Twilio.Device(data.token, { codecPreferences: ['opus', 'pcmu'] });

            device.on('ready', () => {
                setStatus('ready', 'Ready — waiting for calls');
                connectRow.style.display = 'none';
                callRow.style.display    = 'flex';
            });

            device.on('error', (err) => {
                setStatus('error', `Error: ${err.message}`);
                connectBtn.disabled = false;
            });

            device.on('disconnect', () => {
                setStatus('ready', 'Call ended — waiting for calls');
                answerBtn.disabled = true;
                hangupBtn.disabled = true;
                activeConnection   = null;
            });

            device.on('incoming', (conn) => {
                activeConnection = conn;
                setStatus('ringing', 'Incoming call...');
                answerBtn.disabled = false;

                conn.on('disconnect', () => {
                    setStatus('ready', 'Call ended — waiting for calls');
                    answerBtn.disabled = true;
                    hangupBtn.disabled = true;
                    activeConnection   = null;
                });
            });

        } catch (err) {
            setStatus('error', 'Failed — is the server running?');
            connectBtn.disabled = false;
            console.error(err);
        }
    }

    // user gesture → AudioContext allowed
    connectBtn.addEventListener('click', init);

    answerBtn.addEventListener('click', () => {
        if (!activeConnection) return;
        activeConnection.accept();
        setStatus('oncall', 'On call');
        answerBtn.disabled = true;
        hangupBtn.disabled = false;
    });

    hangupBtn.addEventListener('click', () => {
        if (activeConnection) activeConnection.disconnect();
    });
</script>
</body>
</html>
